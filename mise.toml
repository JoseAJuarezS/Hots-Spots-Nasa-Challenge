[tools]
duckdb = "latest"
node = "26.13.1"
pnpm = "12.18.0"
python = "3.15.2"
"github:tectonic-typesetting/tectonic" = "0.17.0"
uv = "0.13.8"

[env]
_.path = ["frontend/node_modules/.bin"]

[tasks."front:install"]
description = "Instala las dependencias del frontend"
dir = "frontend"
run = "pnpm install"

[tasks."front:dev"]
description = "Servidor de desarrollo del frontend (Vite)"
dir = "frontend"
depends = ["front:install"]
run = "pnpm dev"

[tasks."front:build"]
description = "Compila el frontend para producción"
dir = "frontend"
depends = ["front:install"]
run = "pnpm build"

[tasks."front:preview"]
description = "Sirve la build de producción en local"
dir = "frontend"
depends = ["front:build"]
run = "pnpm preview"

[tasks."front:lint"]
description = "Revisa el código del frontend con oxlint"
dir = "frontend"
run = "pnpm lint"

[tasks."datos:cargar"]
description = "Carga los CSV de '../data de prueba' en analisis/focos.duckdb"
run = "duckdb -no-agent analisis/focos.duckdb < analisis/01_cargar.sql"

[tasks."datos:correlacion"]
description = "Correlación MODIS vs VIIRS y constantes de conversión"
run = [
  "duckdb -no-agent analisis/focos.duckdb < analisis/02_correlacion.sql",
  "duckdb -no-agent analisis/focos.duckdb < analisis/03_k_mensual.sql",
]

[tasks."datos:armonizar"]
description = "Serie mensual armonizada 2000-2025 (escala VIIRS S-NPP)"
run = "duckdb -no-agent analisis/focos.duckdb < analisis/04_armonizar.sql"

[tasks."armonizacion:reglas"]
description = "Compara MODIS y VIIRS crudos en 2012-2017 y obtiene las reglas (analisis/reglas/)"
run = "duckdb -no-agent < analisis/06_reglas_armonizacion.sql"

[tasks."armonizacion:aplicar"]
description = "Armoniza todo MODIS 2000-2025 con las reglas (datos_armonizados/)"
run = "duckdb -no-agent < analisis/07_armonizar_modis.sql"

[tasks."armonizacion:validar"]
description = "Compara MODIS armonizado con VIIRS 2018+ y mide el error (analisis/validacion/)"
run = "duckdb -no-agent < analisis/08_validar_armonizacion.sql"

[tasks."armonizacion:todo"]
description = "Reglas -> armonizar -> validar"
run = [
  "duckdb -no-agent < analisis/06_reglas_armonizacion.sql",
  "duckdb -no-agent < analisis/07_armonizar_modis.sql",
  "duckdb -no-agent < analisis/08_validar_armonizacion.sql",
]

[tasks."docs:pdf"]
description = "Compila los .tex de docs/frontend a PDF con Tectonic"
dir = "docs/frontend"
run = "tectonic -X compile plan.tex"

[tasks."back:install"]
description = "Instala las dependencias del backend (uv)"
dir = "backend"
run = "uv sync"

[tasks."back:dev"]
description = "Servidor de desarrollo de la API (FastAPI, recarga automática)"
dir = "backend"
depends = ["back:install"]
run = "uv run fastapi dev app/main.py"

[tasks."modelo:datos"]
description = "Construye la rejilla celda × mes (MODIS armonizado y VIIRS) para la red"
dir = "modelo"
run = "uv run python datos.py"

[tasks."modelo:entrenar"]
description = "Entrena la red con MODIS 2000-2017 y la valida con VIIRS 2018+"
dir = "modelo"
run = "uv run python entrenar.py"
