[tools]
duckdb = "latest"
node = "26.13.1"
pnpm = "12.18.0"
python = "3.15.2"
"github:tectonic-typesetting/tectonic" = "0.17.0"
uv = "0.13.8"

[env]
_.path = ["frontend/node_modules/.bin"]
# Datos de FIRMS fuera del repo (CSV crudos + Parquet). Para usar otra carpeta,
# defínela en mise.local.toml (no se sube):  [env] FIRMS_DATA_DIR = "/ruta/a/datos_firms"
FIRMS_DATA_DIR = "{{config_root}}/../datos_firms"

[tasks."front:install"]
description = "Instala las dependencias del frontend"
dir = "frontend"
run = "pnpm install"

[tasks."front:dev"]
description = "Servidor de desarrollo del frontend (Vite)"
dir = "frontend"
depends = ["front:install"]
run = "pnpm dev"

[tasks."front:build"]
description = "Compila el frontend para producción"
dir = "frontend"
depends = ["front:install"]
run = "pnpm build"

[tasks."front:preview"]
description = "Sirve la build de producción en local"
dir = "frontend"
depends = ["front:build"]
run = "pnpm preview"

[tasks."front:lint"]
description = "Revisa el código del frontend con oxlint"
dir = "frontend"
run = "pnpm lint"

[tasks."datos:estado"]
description = "Qué CSV y Parquet hay en $FIRMS_DATA_DIR por país y sensor"
run = "python analisis/firms.py estado"

[tasks."datos:tamano"]
description = "Cuánto falta por descargar de FIRMS para los países de analisis/paises.txt"
run = "python analisis/firms.py tamano"

[tasks."datos:descargar"]
description = "Descarga de FIRMS los CSV que falten (países de analisis/paises.txt)"
run = "python analisis/firms.py descargar"

[tasks."datos:ingerir"]
description = "Convierte los CSV de $FIRMS_DATA_DIR/crudos a Parquet (solo lo que cambió)"
run = "python analisis/firms.py ingerir"

[tasks."datos:cargar"]
description = "Carga los Parquet de $FIRMS_DATA_DIR en analisis/focos.duckdb"
run = "duckdb -no-agent analisis/focos.duckdb < analisis/01_cargar.sql"

[tasks."datos:correlacion"]
description = "Correlación MODIS vs VIIRS y constantes de conversión"
run = [
  "duckdb -no-agent analisis/focos.duckdb < analisis/02_correlacion.sql",
  "duckdb -no-agent analisis/focos.duckdb < analisis/03_k_mensual.sql",
]

[tasks."datos:propuesta"]
description = "Propuesta de armonización MODIS -> VIIRS con 2012 y 2018 (solo India; lee $FIRMS_DATA_DIR/crudos, exporta a analisis/salida/)"
run = "duckdb -no-agent analisis/propuesta.duckdb < analisis/05_propuesta_2012_2018.sql"

[tasks."datos:armonizar"]
description = "Serie mensual armonizada 2000-2025 (escala VIIRS S-NPP)"
run = "duckdb -no-agent analisis/focos.duckdb < analisis/04_armonizar.sql"

[tasks."docs:pdf"]
description = "Compila los .tex de docs/frontend a PDF con Tectonic"
dir = "docs/frontend"
run = "tectonic -X compile plan.tex"

[tasks."back:install"]
description = "Instala las dependencias del backend (uv)"
dir = "backend"
run = "uv sync"

[tasks."back:dev"]
description = "Servidor de desarrollo de la API (FastAPI, recarga automática)"
dir = "backend"
depends = ["back:install"]
run = "uv run fastapi dev app/main.py"
